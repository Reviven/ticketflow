version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ticketflow-db
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ticketflow-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ticketflow
      SPRING_DATASOURCE_USERNAME: ticketflow
      SPRING_DATASOURCE_PASSWORD: ticketflow123
      JWT_SECRET: TicketFlowSuperSecretKey2024VeryLongKeyForHMACSHA256Algorithm!
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: ticketflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
